# ╔══════════════════════════════════════════════════════════════╗
# ║              tmux Configuration                             ║
# ║              Theme: Catppuccin Latte                        ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Location: ~/.tmux.conf
#
# After editing, reload with:
#   tmux source ~/.tmux.conf
# Or inside tmux:
#   Prefix + r  (after adding the bind-key below)

# ── Prefix ─────────────────────────────────────────────────────
# Change prefix from Ctrl+b to Ctrl+a (easier to reach, screen-compatible)

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ────────────────────────────────────────────────────

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   # True color support
set -g history-limit 50000                          # Scrollback buffer
set -g mouse on                                     # Mouse support (click panes, scroll)
set -g base-index 1                                 # Start window numbering at 1
set -g pane-base-index 1                            # Start pane numbering at 1
set -g renumber-windows on                          # Re-number windows on close
# set -g set-clipboard on                             # Use system clipboard
set -s set-clipboard on                             # Use system clipboard
set -sg escape-time 0                               # No delay for escape key (important for Neovim)
set -g focus-events on                              # Pass focus events to apps (Neovim autoread)
set -g display-time 2000                            # Status messages display for 2s
set -g status-interval 5                            # Refresh status bar every 5s

# ── Vi Mode ────────────────────────────────────────────────────

set -g mode-keys vi                    # Vi keys in copy mode
set -g status-keys vi                  # Vi keys in command prompt

bind -T copy-mode-vi v   send -X begin-selection
if-shell "uname | grep -q Darwin" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'clip.exe'"
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi H   send -X start-of-line
bind -T copy-mode-vi L   send -X end-of-line

# ── Key Bindings ───────────────────────────────────────────────

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Intuitive splits (open in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick pane zoom toggle
bind z resize-pane -Z

# Jump to last window
bind a last-window

# Kill pane/window without confirm
bind x kill-pane
bind X kill-window

# Copy mode
bind Enter copy-mode

# ── Catppuccin Latte Colors ────────────────────────────────────
# Full palette reference: https://github.com/catppuccin/catppuccin

# Latte palette
latte_rosewater="#dc8a78"
latte_flamingo="#dd7878"
latte_pink="#ea76cb"
latte_mauve="#8839ef"
latte_red="#d20f39"
latte_maroon="#e64553"
latte_peach="#fe640b"
latte_yellow="#df8e1d"
latte_green="#40a02b"
latte_teal="#179299"
latte_sky="#04a5e5"
latte_sapphire="#209fb5"
latte_blue="#1e66f5"
latte_lavender="#7287fd"
latte_text="#4c4f69"
latte_subtext1="#5c5f77"
latte_subtext0="#6c6f85"
latte_overlay2="#7c7f93"
latte_overlay1="#8c8fa1"
latte_overlay0="#9ca0b0"
latte_surface2="#acb0be"
latte_surface1="#bcc0cc"
latte_surface0="#ccd0da"
latte_base="#eff1f5"
latte_mantle="#e6e9ef"
latte_crust="#dce0e8"

# ── Status Bar ─────────────────────────────────────────────────

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#e6e9ef,fg=#4c4f69"    # Mantle bg, Text fg

# Left side: session name
set -g status-left-length 40
set -g status-left "#[bg=#1e66f5,fg=#eff1f5,bold] #S #[bg=#e6e9ef,fg=#1e66f5]"

# Right side: host | date | time
set -g status-right-length 80
set -g status-right "#[fg=#179299]#[bg=#179299,fg=#eff1f5] %a %d %b #[bg=#1e66f5,fg=#eff1f5,bold] %H:%M "

# Window tabs
set -g window-status-format " #I:#W "
set -g window-status-style "bg=#e6e9ef,fg=#6c6f85"

set -g window-status-current-format "#[bg=#dce0e8,fg=#1e66f5,bold] #I:#W#{?window_zoomed_flag, 󰍉,} "
set -g window-status-current-style "bg=#dce0e8,fg=#1e66f5,bold"

set -g window-status-separator ""

# ── Pane Borders ───────────────────────────────────────────────

set -g pane-border-style "fg=#ccd0da"
set -g pane-active-border-style "fg=#1e66f5"

# ── Message / Command Prompt ───────────────────────────────────

set -g message-style "bg=#1e66f5,fg=#eff1f5,bold"
set -g message-command-style "bg=#df8e1d,fg=#eff1f5,bold"

# ── Plugins (TPM) ──────────────────────────────────────────────
# Install TPM first:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#
# Install plugins:
#   Prefix + I (capital i)
#
# Update plugins:
#   Prefix + U

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Session persistence — save and restore sessions across reboots
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'    # Save pane contents too
set -g @resurrect-strategy-nvim 'session'        # Restore Neovim sessions
set -g @continuum-restore 'on'                   # Auto-restore on tmux start
set -g @continuum-save-interval '15'             # Save every 15 minutes

# Better mouse support
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
