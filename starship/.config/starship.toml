# ╔══════════════════════════════════════════════════════════════╗
# ║              Starship Configuration                          ║
# ║              Theme: Catppuccin Latte (minimal)               ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Location: ~/.config/starship.toml
#
# Prompt: folder, git branch, then ":". Add $git_status or $cmd_duration to
# `format` to show those modules too.
add_newline = false
format = "$directory$git_branch $character"

palette = "catppuccin_latte"

[palettes.catppuccin_latte]
rosewater = "#dc8a78"
flamingo = "#dd7878"
pink = "#ea76cb"
mauve = "#8839ef"
red = "#d20f39"
maroon = "#e64553"
peach = "#fe640b"
yellow = "#df8e1d"
green = "#40a02b"
teal = "#179299"
sky = "#04a5e5"
sapphire = "#209fb5"
blue = "#1e66f5"
lavender = "#7287fd"
text = "#4c4f69"
subtext1 = "#5c5f77"
subtext0 = "#6c6f85"
overlay2 = "#7c7f93"
overlay1 = "#8c8fa1"
overlay0 = "#9ca0b0"
surface2 = "#acb0be"
surface1 = "#bcc0cc"
surface0 = "#ccd0da"
base = "#eff1f5"
mantle = "#e6e9ef"
crust = "#dce0e8"

# ── Directory ──────────────────────────────────────────────────
[directory]
style = "bold blue"
format = "[$path]($style)"
truncation_length = 3
truncate_to_repo = true

# ── Git ────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "teal"
format = "[$symbol$branch]($style)"

# ── Prompt Character ───────────────────────────────────────────
[character]
success_symbol = ":"
error_symbol = ":"
